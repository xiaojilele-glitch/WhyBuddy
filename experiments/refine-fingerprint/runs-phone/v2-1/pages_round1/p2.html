    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>铁人打卡 - 记录</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {

[data-theme="light"] header .bg-zinc-900,html[data-theme="light"] header .bg-zinc-950,html[data-theme="light"] header .bg-neutral-800,html[data-theme="light"] header .bg-neutral-900,html[data-theme="light"] header .bg-neutral-950,html[data-theme="light"] header .bg-stone-800,html[data-theme="light"] header .bg-stone-900,html[data-theme="light"] header .bg-stone-950{background-color:var(--muted)!important;color:var(--chrome-fg,#0f172a)!important}aside nav a{box-sizing:border-box;width:100%;display:flex!important;flex-direction:row!important;align-items:center!important;gap:.5rem}aside>:first-child:not(nav):not(:has(nav)){display:flex!important;flex-direction:row!important;align-items:center!important;gap:.5rem}aside :is(img,svg){flex-shrink:0}aside:has(nav a){min-width:16rem!important;box-sizing:border-box}aside[class*="fixed"]:has(nav a),aside[class*="absolute"]:has(nav a){width:16rem!important}aside[class*="fixed"]:has(nav a)~*,aside[class*="absolute"]:has(nav a)~*{margin-left:16rem!important}aside [aria-current="page"]{background-color:color-mix(in srgb,var(--primary,currentColor) 16%,var(--chrome,transparent))!important;color:var(--chrome-fg,inherit)!important;font-weight:600}header nav[aria-label="Breadcrumb"] [aria-current="page"],header nav[aria-label="breadcrumb"] [aria-current="page"]{background-color:transparent!important;color:var(--chrome-fg,inherit)!important;font-weight:600}</style><script>

<body class="w-full h-full overflow-hidden flex flex-col bg-[#121212] text-white font-sans">

    <!-- 顶部 Header -->
    <header class="flex-shrink-0 bg-darkBg border-b border-borderCol px-4 py-3 flex items-center justify-between z-10">
    <div class="flex items-center space-x-2">
      <div class="w-8 h-8 rounded-lg bg-brand flex items-center justify-center font-bold text-white text-lg tracking-wider">铁</div>
      <span class="font-bold text-lg tracking-wide text-white">铁人打卡</span>
    </div>
    <div class="flex items-center space-x-2 bg-cardBg px-3 py-1.5 rounded-full border border-borderCol">
      <div class="w-2 h-2 rounded-full bg-success animate-pulse"></div>
      <span class="text-xs text-gray-300">健身学员</span>
    </div>
  </header>

    <!-- 中间主内容区 (可滚动) -->
    <main class="flex-1 min-h-0 overflow-y-auto px-4 py-4 space-y-4">
        
        <!-- 区块1：顶部近期训练指标卡区 (左右并排 2 张卡片) -->
        <div class="grid grid-cols-2 gap-3">
            <!-- 卡片1：本周打卡总次数 -->
            <div class="bg-[#1E1E1E] border border-[#2C2C2C] rounded-xl p-3.5 flex flex-col justify-between">
                <div class="text-xs text-[#9CA3AF] flex items-center justify-between">
                    <span>本周打卡总次数</span>
                    <span class="text-speedGreen text-[10px] bg-[#00E676]/10 px-1.5 py-0.5 rounded font-medium">+20%</span>
                </div>
                <div class="mt-2 flex items-baseline space-x-1">
                    <span class="text-2xl font-black text-white" data-value="checkin_record" data-aggregate="count">5</span>
                    <span class="text-xs text-[#9CA3AF]">次</span>
                </div>
                <!-- 迷你趋势图表内联 SVG -->
                <div class="mt-2 h-6 w-full">
                    <svg class="w-full h-full overflow-visible" viewBox="0 0 100 24">
                        <path d="M0 20 L20 15 L40 18 L60 8 L80 12 L100 4" fill="none" stroke="#FF4500" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        <circle cx="100" cy="4" r="2.5" fill="#FF4500" />
                    </svg>
                </div>
            </div>

            <!-- 卡片2：累计训练时长 -->
            <div class="bg-[#1E1E1E] border border-[#2C2C2C] rounded-xl p-3.5 flex flex-col justify-between">
                <div class="text-xs text-[#9CA3AF] flex items-center justify-between">
                    <span>累计训练时长</span>
                    <span class="text-speedGreen text-[10px] bg-[#00E676]/10 px-1.5 py-0.5 rounded font-medium">达标</span>
                </div>
                <div class="mt-2 flex items-baseline space-x-1">
                    <span class="text-2xl font-black text-white" data-value="checkin_record" data-aggregate="sum:record_duration">325</span>
                    <span class="text-xs text-[#9CA3AF]">分钟</span>
                </div>
                <!-- 迷你趋势图表内联 SVG -->
                <div class="mt-2 h-6 w-full">
                    <svg class="w-full h-full overflow-visible" viewBox="0 0 100 24">
                        <path d="M0 18 L20 12 L40 16 L60 10 L80 6 L100 8" fill="none" stroke="#00E676" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        <circle cx="100" cy="8" r="2.5" fill="#00E676" />
                    </svg>
                </div>
            </div>
        </div>

        <!-- 区块2：快捷筛选标签栏 -->
        <div class="flex items-center space-x-2 overflow-x-auto pb-1 text-xs no-scrollbar">
            <button class="flex-shrink-0 px-3.5 py-1.5 rounded-lg bg-lava text-white font-medium transition-colors">全部项目</button>
            <button class="flex-shrink-0 px-3.5 py-1.5 rounded-lg bg-[#1E1E1E] border border-[#2C2C2C] text-[#9CA3AF] hover:text-white transition-colors">力量举</button>
            <button class="flex-shrink-0 px-3.5 py-1.5 rounded-lg bg-[#1E1E1E] border border-[#2C2C2C] text-[#9CA3AF] hover:text-white transition-colors">高强度间歇(HIIT)</button>
            <button class="flex-shrink-0 px-3.5 py-1.5 rounded-lg bg-[#1E1E1E] border border-[#2C2C2C] text-[#9CA3AF] hover:text-white transition-colors">核心稳定</button>
            <button class="flex-shrink-0 px-3.5 py-1.5 rounded-lg bg-[#1E1E1E] border border-[#2C2C2C] text-[#9CA3AF] hover:text-white transition-colors">有氧耐力</button>
        </div>

        <!-- 区块3：历史打卡记录主列表 (垂直卡片流) -->
        <div class="space-y-3" data-rows="checkin_record" data-sort="record_date" data-order="desc" data-limit="8">
            <div class="text-xs text-[#9CA3AF] font-medium px-1">2023-10月 训练明细</div>

            <!-- 列表项 1 -->
            <div class="bg-[#1E1E1E] border border-[#2C2C2C] rounded-xl p-3 flex items-center justify-between transition-all hover:border-lava/50">
                <div class="flex items-center space-x-3">
                    <div class="w-10 h-10 rounded-lg bg-lava/10 border border-lava/30 flex items-center justify-center text-lava font-bold">
                        💪
                    </div>
                    <div>
                        <div class="text-sm font-semibold text-white" data-field="record_title">硬拉极限突破训练</div>
                        <div class="text-xs text-[#9CA3AF] mt-0.5"><span data-field="record_date">2023-10-24</span> · 耗时 <span data-field="record_duration">65</span>分钟</div>
                    </div>
                </div>
                <div class="flex flex-col items-end space-y-1">
                    <span class="px-2 py-0.5 rounded-full text-[10px] bg-speedGreen/10 text-speedGreen border border-speedGreen/20 font-medium" data-field="record_result">
                        打卡成功
                    </span>
                    <button class="text-[10px] text-[#9CA3AF]" data-action="submitWorkflow" data-entity="checkin_record">提交审批</button>
                </div>
            </div>

        </div>

    </main>

    <nav class="flex justify-around items-center py-2 bg-darkBg border-t border-borderCol/50">

</nav>

</body>
</html>
