# SlideRule — 生产服务器专用 compose（档位二/三：只拉镜像，永不本地构建）
#
# 前置：main 每次发版由 .github/workflows/deploy-images.yml 自动构建镜像
# 推到 ghcr.io。服务器上：
#
#   cp .env.example .env    # 填 LLM_API_KEY + SLIDERULE_AUTH_SECRET
#   docker compose -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.prod.yml up -d
#   → http://服务器IP:3000/agent-loop/workbench
#
# 更新（档位二，手动两条命令）：
#   docker compose -f docker-compose.prod.yml pull && docker compose -f docker-compose.prod.yml up -d
#
# 全自动更新（档位三，可选）：
#   docker compose -f docker-compose.prod.yml --profile auto up -d
#   （watchtower 每 5 分钟检查新镜像，自动拉取重启；回滚前记得先停它）
#
# ── 镜像地址：四个变量，从粗到细 ────────────────────────────
# 默认拼出 ghcr.io/xiaojilele-glitch/whybuddy-{app,python}:latest。四段都能单独换：
#
#   SLIDERULE_REGISTRY     仓库主机   默认 ghcr.io
#   SLIDERULE_IMAGE_OWNER  命名空间   默认 xiaojilele-glitch
#   SLIDERULE_IMAGE_TAG    版本       默认 latest
#   SLIDERULE_IMAGE_APP / _PYTHON     整条地址，给上面三个都拼不出来的情况兜底
#
# ⚠️ 换 registry 通常**必须连 owner 一起换**。各家仓库的命名空间是各自独立的：
# 单独设 SLIDERULE_REGISTRY=docker.io 会拼出 docker.io/xiaojilele-glitch/…，
# 而那个用户在 Docker Hub 上并不存在——看着像配好了，pull 才报 not found。
#
# 自己 fork 后用自己构建的镜像（deploy-images.yml 会推到你名下）：
#   SLIDERULE_REGISTRY=ghcr.io
#   SLIDERULE_IMAGE_OWNER=<你的GitHub用户名小写>
#
# 回滚到某次发版：SLIDERULE_IMAGE_TAG=<commit-sha> 再 up -d（一处改，两个服务一起走）。
#
# 国内服务器拉 ghcr 慢/超时，三选一：
#   a) SLIDERULE_REGISTRY=ghcr.nju.edu.cn（ghcr 镜像站，owner 不用动——镜像站是透传的）
#   b) CI 配了 Docker Hub 双推后走 Hub（注意 owner 是你的 **Docker Hub** 用户名，
#      跟 GitHub 用户名不一定一样）：
#      SLIDERULE_REGISTRY=docker.io
#      SLIDERULE_IMAGE_OWNER=<你的DockerHub用户名>
#   c) 给 Docker daemon 配代理
#
# 账号功能（可选，遗留登录/邮箱验证码/projects 才需要）：
#   docker compose -f docker-compose.prod.yml --profile accounts up -d

services:
  python:
    image: ${SLIDERULE_IMAGE_PYTHON:-${SLIDERULE_REGISTRY:-ghcr.io}/${SLIDERULE_IMAGE_OWNER:-xiaojilele-glitch}/whybuddy-python:${SLIDERULE_IMAGE_TAG:-latest}}
    container_name: sliderule-python
    env_file:
      - .env
    environment:
      PORT: 9700
      SLIDE_RULE_INTERNAL_KEY: ${SLIDE_RULE_INTERNAL_KEY:-dev-slide-rule-internal}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-sliderule}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-sliderule_minio_change_me}
      S3_BUCKET: ${S3_BUCKET:-sliderule-skills}
    volumes:
      - sliderule-python-data:/app/data
    networks:
      - default
      - postgres-internal
    depends_on:
      minio:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9700/health', timeout=3)",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  app:
    image: ${SLIDERULE_IMAGE_APP:-${SLIDERULE_REGISTRY:-ghcr.io}/${SLIDERULE_IMAGE_OWNER:-xiaojilele-glitch}/whybuddy-app:${SLIDERULE_IMAGE_TAG:-latest}}
    container_name: sliderule-app
    depends_on:
      python:
        condition: service_healthy
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3001
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-sliderule}
      DB_USER: ${DB_USER:-root}
      DB_PASSWORD: ${DB_PASSWORD:-sliderule_root_change_me}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      SLIDERULE_V5_BACKEND: python
      PYTHON_SLIDE_RULE_BASE_URL: http://python:9700
      PYTHON_SLIDE_RULE_INTERNAL_KEY: ${SLIDE_RULE_INTERNAL_KEY:-dev-slide-rule-internal}
      PYTHON_API_TARGET: http://python:9700
      AGENT_LOOP_API_TARGET: http://python:9700
    ports:
      - "3000:3001"
    networks:
      - default
      - postgres-internal
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 15s
    restart: unless-stopped

  # 档位三（可选）：自动更新小管家。发现 ghcr 有新镜像 → 自动 pull + 重启。
  # 注意：回滚到旧 tag 期间要先停掉它，否则下个周期又被升回 latest。
  watchtower:
    image: containrrr/watchtower
    container_name: sliderule-watchtower
    profiles: ["auto"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: --interval 300 --cleanup sliderule-app sliderule-python
    restart: unless-stopped

  # 可选：遗留账号体系（登录/邮箱验证码/projects）才需要。
  mysql:
    image: mysql:8.0
    container_name: sliderule-mysql
    profiles: ["accounts"]
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-sliderule_root_change_me}
      MYSQL_DATABASE: ${DB_NAME:-sliderule}
    volumes:
      - sliderule-mysql-data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "127.0.0.1",
          "-uroot",
          "-p${DB_PASSWORD:-sliderule_root_change_me}",
        ]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  # 技能包货仓。API 只给 compose 内网（python 走 http://minio:9000），
  # 9000 不映射到公网。控制台只绑 127.0.0.1，SSH 隧道再看。
  minio:
    # Docker Hub `minio/minio` 在这台生产机上 pull 被拒；Quay 同官方镜像。
    image: quay.io/minio/minio:latest
    container_name: sliderule-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-sliderule}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-sliderule_minio_change_me}
    volumes:
      - sliderule-minio-data:/data
    ports:
      - "127.0.0.1:9001:9001"
    networks:
      - default
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
    restart: unless-stopped

volumes:
  sliderule-mysql-data:
    name: sliderule-mysql-data
  sliderule-python-data:
    name: sliderule-python-data
  sliderule-minio-data:
    name: sliderule-minio-data

networks:
  postgres-internal:
    external: true
    name: postgres-stack-internal
