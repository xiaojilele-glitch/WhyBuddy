# ── 显式例外：有意为之，并且写清了理由 ──────────────────────────────────────
#
# ⚠ 跟 [baseline] 是**两件事**：baseline 是欠账（只许变少），这里是「就该这样，
#   原因如下」。grok 的对应物是 Cargo.toml 依赖行上那句注释——依赖存在是事实，
#   **为什么存在**得写下来。
#
# ⚠ 门槛：必须写 why，判据还盯着总量。拿它消违规等于把闸关掉。
#   一个包对只有在它背后**每一条**具体边都在这里时才不算违规。

# ── 入口：没人 import 它是**对的** ──────────────────────────────────────────────
#
# 抄 grok：他们 90 个 crate 里被依赖数为 0 的只有装配根 `xai-grok-pager-bin`
# 一个——因为它是 binary。入口天然没有上游，其余模块没上游就得解释。
#
# ⚠ 这里只许放**真入口**，不许拿通配符消孤儿。判据
#   `test_入口声明不许当消孤儿的开关` 盯着：任何能一口气罩住整个包的模式
#   （services.* / routes.* 之类）直接红。
[entrypoints]
patterns = [
  "app",                 # 装配根。uvicorn 用 `app:app` 起它。
  "arch_graph",          # 架构编译器自己，命令行工具。
  "complete_migration",  # 一次性迁移记录，跟 scripts 同性质。
  "scripts.*",           # 运维/评测脚本，每个都是自己的入口。
]


# ── 孤儿的归类 ──────────────────────────────────────────────────────────────
#
# `[baseline].orphans` 只记「有多少」，不记「为什么」。这一节补的是后者。
#
# ⚠ 为什么必须记：§26 说这 54 个"挨个看了，绝大多数各有理由"，§30 订正说
#   "挨个看了是假的，只读了 3 个就外推了 54 个"，并留下 19 个"❓没说清归谁"。
#   2026-08-29 夜真的逐个读了模块头，**又翻出第三种可能**：接线在，只是在另一
#   门语言里（见 cross_language_entry）。一张没有归类的名单，下一个人只能重新
#   读一遍——而前两次重读都得出了不同的、且都不完整的结论。
#
# 五类，含义各不相同，**别混着用**：
#
#   cross_language_entry  Node 在子进程里按**拼出来的字符串** __import__ 它。
#                         依赖图两侧都看不见这条边。**是产线代码，不许删。**
#                         由 tests/test_cross_language_entrypoints.py 两头钉住。
#
#   migration_ledger      迁移记账：产出的是「哪块归 Python、哪块留 Node」的报告，
#                         消费者只有判据。不在产品链上，**这是设计如此**，
#                         不是欠账。占 25 个，是这份名单的主体。
#
#   contract_mirror       Node 拥有运行时，Python 只锁信封形状（模块头自己写着
#                         "remain Node-owned" / "side-effect free fake runtime"）。
#
#   superseded            明说被取代或未挂载。**这批是真的可以删**，但删之前
#                         要确认没有判据靠它的存在（routes.sliderule 未挂载，
#                         app.py 只 include sliderule_full）。
#
#   unwired               ⚠ **这批才是该问的**：Python 自己拥有运行时（模块头
#                         明写 Python-owned + 真实现，不是契约壳），却没有任何
#                         接线，也不是跨语言入口。每一个都要回答"这块运行时
#                         到底该不该被 wire 起来"——那是产品判断，不是架构活，
#                         所以这里只记账不处理。
#
# ⚠ 判据（Test孤儿都要有归类）钉两头：孤儿必须有归类（正），
#   归类不许指向已经不是孤儿的模块（反）。只钉一头，名单会慢慢变成一份过期的历史。
