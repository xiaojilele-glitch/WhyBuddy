# 架构清单 —— 依赖要**显式声明**，没声明的边判据当场变红。
#
# 抄 grok-build：他们 91 个 crate 各自在 Cargo.toml 里声明依赖，边上还写着
# 为什么依赖（`# CompactionDetail, embedded in CompactionMode::Segments.`），
# 347 条边全由编译器强制。我们没有那个编译器，这份清单 + tests/test_architecture.py
# 就是它。详见 arch_graph.py 模块头。
#
# ⚠ 改这个文件 = 改架构。加一条 may_depend_on 之前先问：这条依赖是必须的，
#   还是"顺手 import 一下"？后者的代价是下一个人再也分不清哪些边是设计、
#   哪些是历史。

[layer.models]
rank = 0
what = "数据形状"
# 数据模型不依赖任何内部模块——它被所有人依赖，反过来就成环。
may_depend_on = []

[layer.config]
rank = 0
what = "配置"
may_depend_on = []

[layer.sliderule_llm]
rank = 1
what = "LLM 通道"
# 网关要读配置、要用状态模型的形状。
may_depend_on = ["config", "models"]

[layer.services]
rank = 2
what = "业务"
# 业务层调 LLM 通道、读配置、用状态模型。**不许反向依赖 routes/app**。
may_depend_on = ["config", "models", "sliderule_llm"]

[layer.middlewares]
rank = 2
what = "中间件"
# 身份中间件要读配置与用户模型。
#
# ⚠ 2026-08-29 补 services：`current_user` 要 `services.auth_tokens`（验令牌）
#   与 `services.identity_store`（查用户、查停用/撤销）。这不是绕开分层——
#   鉴权本来就要问身份服务，把这两样搬进中间件等于让身份逻辑长出第二份。
#   与 routes 同 rank：两者都是「HTTP 边缘」，都可以调业务，业务不许反过来调它们。
may_depend_on = ["config", "models", "services"]

[layer.routes]
rank = 3
what = "HTTP 路由"
# 路由是薄的：拼装业务、读配置、用中间件鉴权。
may_depend_on = ["config", "models", "services", "sliderule_llm", "middlewares"]

[layer.app]
rank = 4
what = "装配根"
# 对应 grok 的 composition root（xai-grok-pager-bin）：只负责把东西装起来。
#
# ⚠ sliderule_llm 这一项是 2026-09-08 加的，理由不是「装配要用 LLM」——
#   装配根不调 LLM。是 `ensure_llm_proxy_bypass()`：Windows 上 HTTP_PROXY
#   为空时 httpx 走注册表里的 Clash，NO_PROXY 环境变量不生效，控制面每句
#   都 Cloudflare 522。绕过名单要在**任何服务 import 之前**设好，而算这份
#   名单要读 LLM_BASE_URL——那份逻辑的家在 sliderule_llm.config，抄一份到
#   装配根只会有两份会漂的名单。config 是叶子（顶层只有标准库、import 期
#   不读 env、httpx 由 PEP 562 推迟），所以这条边顶层 import 就行，
#   不必躲进函数体。
may_depend_on = ["config", "models", "routes", "services", "sliderule_llm", "middlewares", "stdio_utf8"]

[layer.scripts]
rank = 5
what = "运维脚本"
# 一次性脚本可以够到任何东西——它不在产品链上，出事也炸不到用户。
may_depend_on = ["config", "models", "services", "routes", "sliderule_llm", "app", "middlewares", "stdio_utf8"]

# ── 顶层单文件模块：自己就是一个包 ────────────────────────────────────────────
#
# ⚠ 2026-08-29 之前这三个**根本不在架构图里**。扫描器的包名单是手写的，
#   而那份名单同时当「哪些 import 算内部边」的筛子和 `_pkg_of` 的分类器用，
#   于是漏一项漏两次：`app.py` 第 24 行顶层 `from stdio_utf8 import ...` 那条边
#   在图里不存在，`stdio_utf8` 反而以"零入度、没人用"的样子躺在孤儿名单里；
#   就算边补出来，`_pkg_of` 也会给它打 `"?"`，而 `layer_violations` 见 `"?"` 整条跳过。
#   现在包名单从真实模块集合派生，这三个必须各自声明。
#   一并浮出水面的还有 `complete_migration -> models / services` 两条边——
#   在此之前它们**从来没被任何一道闸看见过**。

[layer.stdio_utf8]
rank = 0
what = "顶层叶子：Windows 管道 UTF-8 钉桩"
# 必须赶在任何会 print 的 import 之前执行，所以它谁都不能依赖。
may_depend_on = []

[layer.arch_graph]
rank = 0
what = "架构编译器自己"
# 抄 grok 的「根 Cargo.toml 是生成的」。它读代码，不参与产品链，零内部依赖。
may_depend_on = []

[layer.complete_migration]
rank = 5
what = "一次性迁移记录"
# 跟 scripts 同一性质：不在产品链上。⚠ 它的两条依赖 2026-08-29 才第一次被闸看见。
may_depend_on = ["models", "services"]


# ── services 内部分层（抄 grok 的叶子 crate）──────────────────────────────────
#
# grok 把 51 个共用叶子（token 估算、路径、文件工具…）切成独立 crate，依赖方向
# 由编译器焊死：大块能用叶子，叶子永远碰不到大块。我们 195 个 services 模块平铺
# 在一个命名空间里，谁都能 import 谁——这正是「463 条 import 藏在函数体里」的根：
# 放在文件头会循环导入，只好挪进函数体。
#
# ⚠ 这份分层是**从今天的真实依赖深度算出来的**（arch_graph.suggest_services_layers），
#   不是重新设计。它是一条棘轮基线：先把现状固定成契约，此后只许变好。
#   别把它读成「架构本该如此」。
#
# ⚠ 同层之间互相依赖是允许的（util 层实测没有内部边，core/flow 有）。
#   闸只挡**越层向上**：叶子碰上层、core 碰 flow。
#
# ⚠ 新加模块要落进某一层。落不进说明它既不是工具也不是编排——那通常意味着
#   它该被拆成两个。

[services_layer.util]
rank = 0
what = "纯工具：不依赖 services 里任何其它模块"
# 深度 0 实测 117 个：不依赖 services 内任何模块。对应 grok 的叶子 crate。
may_depend_on = []
modules = [
  "services.control_budget",
  "services.control_context_compact",
  "services.control_transcript_log",
  "services.control_goal_continuation",
  "services.control_checkpoint",
  "services.control_run_store",
  "services.archetype_legal",
  "services.project_rollout",
  "services.project_preview_config",
  # 预览 Host 注入是纯字符串/命令拼装：不碰 E2B、不读存储。worker 启动
  # Vite 时引用；Agent 源码接不接 allowedHosts 都走这一份。
  "services.vite_preview_hosts",
  "services.project_tool_contracts",
  "services.project_browser_interact",
  "services.project_tool_summary",
  "services.project_verification_gate",
  "services.project_workspace_artifacts",
  "services.project_acceptance",
  # 交付面可用性：只吃 HTML 字符串与 SPEC 字典，services 里谁都不依赖 → 叶子。
  # 跟 gate_health 同一个理由被闭环判定顶层 import。
  "services.deliverable_surface",
  # 批准计划上的交付物类别。只吃计划字典，不读会话、不读工程库 → 叶子。
  "services.deliverable_kind",
  # 闸的体检：谁都不依赖（只吃「结论 + 指纹」两个字符串），所以是叶子。
  # 它反过来被闭环判定顶层 import——叶子层的意义就在这儿：谁都能安全引它。
  "services.gate_health",
  "services.sql_gateway",
  # 工程源码清单是纯校验/哈希：不接 E2B、不读存储，保证路径与内容
  # 合同可在 provider 和持久化两边复用。
  "services.project_manifest",
  "services.workspace_provider",
  "services.stage_legal",
  # 阶段配对台账：只吃「阶段名 + start 事件字典」，出度 0 → 叶子。
  # 被驱动器顶层 import——它是**流级**状态，不许每个泵新建一本
  # （真机那轮心跳全灭就是泵局部变量每几秒清零一次）。
  "services.stage_pairing",
  "services.capability_plan",
  # 原地打转游标：只吃「这一轮的调用列表 + 一个 bool」，services 里谁都不依赖 → 叶子。
  # 抄 grok `IdenticalToolCallRun` 的**分工**：分档（哪些工具算紧档）留在
  # rehearsal_control，因为那要查 TOOL_SCOPE；游标本身只收算好的 bool。
  # 把分档搬进来它就立刻不是叶子了——跟 closed_tools 那句「运行时谓词留在
  # rehearsal_control」同一个理由。
  "services.action_stationarity",
  # 报完工的判决词表：只吃四个算好的值（completed / blocked_reason /
  # 判官三态 / 已驳回次数），services 里谁都不依赖 → 叶子。
  # 同 action_stationarity 那条分工：查 state 的活（指纹、数次数、拼理由）
  # 留在 rehearsal_control，搬进来它就立刻不是叶子。
  "services.done_claim",
  # 活儿清单的纯算法：吃「旧清单 + 这一笔改动」吐新清单，services 里谁都不依赖 → 叶子。
  # 同 action_stationarity / done_claim 那条分工：查 state、发事件、落库留在
  # rehearsal_control，搬进来就立刻不是叶子。
  "services.plan_todo",
  # 问用户那几道题的形状与四条结果文案（抄 grok AskUserQuestion）：
  # 吃「模型送来的入参」吐归一后的题、吃「选了什么」吐回喂给模型的那段话，
  # services 里谁都不依赖 → 叶子。
  # 同 action_stationarity / plan_todo 那条分工：查 state（上一发问了什么）、
  # 发事件、落库留在 rehearsal_control，搬进来它就立刻不是叶子。
  "services.user_questions",
  # 跳的前置表达式树（抄 grok Expr<T>）：叶子怎么判由调用方那个闭包给，
  # 本模块不认识 state → services 里谁都不依赖 → 叶子。
  # 这也是它能当单一真相源的前提：谁都能安全 import 它去问「跑得动吗」。
  "services.hop_requirements",
  # 生命周期钩子的事件闭集 + 派发器：只吃「事件名 + 一份 dict」，
  # services 里谁都不依赖 → 叶子。注册表是进程内的，不从文件发现
  # （配置来源是产品决定，见模块头注）。
  "services.hook_events",
  "services.closed_tools",
  # 技能商店：zip 开箱 / OSS 字节 / 控制面短目录。三个都是叶子。
