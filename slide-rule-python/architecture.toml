# ── component：crate 级的边界（2026-08-29 抄 grok 的 Cargo.toml）─────────────
#
# grok 有 90 个 crate、347 条**声明过**的依赖边，边界由编译器焊死。我们的模块
# 粒度比 crate 细（270 个文件），所以在这里显式声明「哪几个模块是同一个 crate」，
# 以及「哪个 crate 可以依赖哪个」。
#
# ⚠ 这份归组与 may_depend_on **是从今天的真实依赖算出来的**（棘轮基线），
#   不是重新设计。先把现状固定成契约，此后只许变好。
#
# ⚠ 内部成环默认**红**，要单独 allow_internal_cycles = true 并说明理由。
#   归组的目的是声明依赖，不是给环发通行证。


