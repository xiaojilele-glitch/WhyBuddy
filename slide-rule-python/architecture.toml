# ── 闸清单：每条拦截理由归哪道被体检的闸 ────────────────────────────
#
# 2026-09-05 建。起因是「为什么几个月没审查出来」——答案里有一条是**没人知道
# 这个系统里到底有几道闸**。它们散在四五个模块里各发各的 code，没有任何一处
# 把它们摆在一起，于是「15 个会话全被同一道闸按同一个理由拦下」这种事
# 没有观察它的位置。
#
# 值 = `services/gate_health.py` 里的闸名（进体检）；空串 = 明说不体检。
# **新增一条 code 必须在这里出现**，否则 arch_graph --check 变红——
# 逼着加闸的人回答一句「它坏成一直响的时候，谁会发现」。
#
# ⚠ 空串那几条是欠账，只许变少。
[gate_codes]

# 闭环判定三道，都进体检（v5_capability_executor 落）
"APPBUNDLE_RUNTIME_CLOSURE_BLOCKED" = "evidence"
"CLOSURE_GOAL_RELEVANCE_FAILED" = "relevance"
"CLOSURE_FACTORY_TODO_OPEN" = "factoryTodo"
# 第四道：交付面可用性（2026-09-06）。前三道量的都是"流程走完没有"——证据交齐了
# 吗、对不对题、产出跳跑完了吗。没有一道量"用户真正看到的那一屏能不能用"。
# 换 LLM 供应商之后同类题目交付物差三倍（7 页 22 个 input → 3 页 1 个 input），
# 而前三道的输出**逐字相同**。实测数字见 services/deliverable_surface.py 模块头。
# 五条同属一道闸：拦的只有 UNSERVED，其余四条只报不拦，但都由它记进体检。
"CLOSURE_SUBMIT_INTENT_UNSERVED" = "deliverableSurface"
"CLOSURE_SUBMIT_INTENT_UNMAPPED" = "deliverableSurface"
"CLOSURE_NO_ENTRY_SURFACE" = "deliverableSurface"
"CLOSURE_ONE_PAGE_PER_ROLE" = "deliverableSurface"
"CLOSURE_PAGE_WITHOUT_CONTROLS" = "deliverableSurface"

# 生成链路的失败留痕：它们不是"判定"，是**诊断**——随 blocker 透出来给人看，
# 不参与 blocked/hash。诊断没有"一直说同一句话"的退化形态（它只在真失败时
# 出现），所以不进体检。
"LLM_GENERATE_DISABLED" = ""
"LLM_GENERATE_FAILED" = ""
"REFINE_PAINT_FAILED" = ""
"CLOSURE_REBUILD_FAILED" = ""
